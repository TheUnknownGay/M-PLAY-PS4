name: Build M-PLAY PS4

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile and package M-PLAY PS4
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le dépôt
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Vérifier les fichiers du projet
      - name: Verify project files
        run: |
          echo "Checking repository files..."
          pwd
          ls -la

          missing=0

          for file in \
            Makefile \
            src/main.cpp \
            tools/make_gp4.py \
            sce_sys/icon0.png
          do
            if [ -f "$file" ]; then
              echo "OK: $file"
            else
              echo "MISSING: $file"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "Required project files are missing."
            exit 1
          fi

      # 3. Vérifier la toolchain OpenOrbis
      - name: Verify OpenOrbis toolchain
        run: |
          docker run --rm \
            --user 0:0 \
            openorbisofficial/toolchain:latest \
            sh -c '
              echo "Checking OpenOrbis SDK..."
              echo "OO_PS4_TOOLCHAIN=$OO_PS4_TOOLCHAIN"

              test -x /lib/OpenOrbisSDK/bin/linux/create-fself
              test -x /lib/OpenOrbisSDK/bin/linux/PkgTool.Core
              test -f /lib/OpenOrbisSDK/link.x

              echo "OpenOrbis SDK checks passed."
            '

      # 4. Compiler et construire le package
      - name: Compile with OpenOrbis
        run: |
          docker run --rm \
            --user 0:0 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            openorbisofficial/toolchain:latest \
            make

      # 5. Publier les fichiers générés
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M-PLAY-PS4-build
          path: |
            *.pkg
            eboot.bin
            pkg.gp4
            build/**
            sce_sys/param.sfo
          if-no-files-found: warn
          retention-days: 7
