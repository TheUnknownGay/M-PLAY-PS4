
name: Build M-PLAY PS4

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.17"

      - name: Checkout create-fself
        uses: actions/checkout@v4
        with:
          repository: OpenOrbis/create-fself
          path: create-fself-src

      - name: Build create-fself
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/create-fself-src"

          echo "=== Répertoire du projet ==="
          pwd
          ls -la

          echo "=== Recherche des fichiers Go ==="
          find . -maxdepth 3 \( -name go.mod -o -name go-linux.mod \) -print

          if [ ! -f go.mod ] && [ ! -f go-linux.mod ]; then
            echo "::error::Aucun fichier go.mod ou go-linux.mod trouvé à la racine."
            exit 1
          fi

          if [ -f go.mod ]; then
            echo "=== Compilation avec le module principal ==="
            go build -o "$GITHUB_WORKSPACE/tools/create-fself" .
          else
            echo "=== Compilation avec go-linux.mod ==="
            go build -modfile=go-linux.mod \
              -o "$GITHUB_WORKSPACE/tools/create-fself" .
          fi

          chmod +x "$GITHUB_WORKSPACE/tools/create-fself"

          echo "=== Vérification du binaire ==="
          test -x "$GITHUB_WORKSPACE/tools/create-fself"
          ls -lh "$GITHUB_WORKSPACE/tools/create-fself"

      - name: Verify project files
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            Makefile \
            src/main.cpp \
            tools/make_gp4.py \
            tools/create-fself \
            sce_sys/icon0.png
          do
            if [ ! -f "$file" ]; then
              echo "::error::Fichier manquant : $file"
              exit 1
            fi
          done

      - name: Pull OpenOrbis toolchain
        run: docker pull openorbisofficial/toolchain:latest

      - name: Compile with OpenOrbis
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            openorbisofficial/toolchain:latest \
            bash -lc '
              set -euo pipefail

              echo "=== SDK ==="
              ls -ld /lib/OpenOrbisSDK

              echo "=== Compilateurs ==="
              command -v clang || true
              command -v clang++ || true
              command -v ld.lld || true

              echo "=== PkgTool.Core ==="
              find /lib/OpenOrbisSDK -name "PkgTool.Core" -type f

              echo "=== Préparation ==="
              chmod +x tools/create-fself

              echo "=== Nettoyage ==="
              make clean

              echo "=== Compilation ==="
              make

              echo "=== Vérification de param.sfo ==="
              if [ ! -s sce_sys/param.sfo ]; then
                echo "ERREUR : sce_sys/param.sfo absent ou vide après make"
                find sce_sys -maxdepth 2 -type f -print || true
                exit 1
              fi

              ls -lh sce_sys/param.sfo

              echo "=== Entrées de param.sfo ==="
              /lib/OpenOrbisSDK/bin/linux/PkgTool.Core \
                sfo_listentries sce_sys/param.sfo

              echo "=== Vérification des fichiers du paquet ==="
              test -s eboot.bin
              test -s sce_sys/icon0.png
              test -s pkg.gp4

              echo "=== Compilation terminée ==="
            '

      - name: Verify generated files
        shell: bash
        run: |
          set -euo pipefail

          for file in \
            eboot.bin \
            build/mplay.elf \
            build/mplay.oelf \
            sce_sys/param.sfo \
            sce_sys/icon0.png \
            pkg.gp4
          do
            if [ ! -s "$file" ]; then
              echo "::error::Fichier absent ou vide : $file"
              exit 1
            fi

            echo "=== $file ==="
            ls -lh "$file"
            file "$file" || true
            sha256sum "$file"
          done

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M-PLAY-PS4-Diagnostics
          path: |
            sce_sys/param.sfo
            sce_sys/icon0.png
            eboot.bin
            build/mplay.elf
            build/mplay.oelf
            pkg.gp4
          if-no-files-found: warn
          retention-days: 7

      - name: Verify PKG output
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -name '*.pkg' -size +0c \
            -print -quit | grep -q . || {
              echo "::error::Aucun PKG généré"
              exit 1
            }

      - name: Upload PKG artifact
        uses: actions/upload-artifact@v4
        with:
          name: M-PLAY-PS4-PKG
          path: "*.pkg"
          if-no-files-found: error
          retention-days: 7
          
