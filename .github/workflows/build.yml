
name: Build M-PLAY PS4

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Compiler avec OpenOrbis
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            openorbisofficial/toolchain:latest \
            make

      - name: Publier les fichiers générés
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M-PLAY-PS4-build
          path: |
            eboot.bin
            **/*.pkg
          if-no-files-found: warn
