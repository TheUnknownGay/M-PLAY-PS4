name: Build M-PLAY PS4

on:
push:
pull_request:
workflow_dispatch:

permissions:
contents: read

jobs:
build:
name: Compile and Package M-PLAY PS4
runs-on: ubuntu-latest

steps:
  # 1. Récupérer le projet
  - name: Checkout M-PLAY PS4
    uses: actions/checkout@v4

  # 2. Installer Go pour compiler create-fself
  - name: Setup Go
    uses: actions/setup-go@v5
    with:
      go-version: '1.17'

  # 3. Récupérer l'outil officiel OpenOrbis
  - name: Checkout create-fself
    uses: actions/checkout@v4
    with:
      repository: OpenOrbis/create-fself
      path: create-fself-src

  # 4. Construire create-fself
  - name: Build create-fself
    working-directory: create-fself-src/cmd/create-fself
    run: |
      set -eu

      mkdir -p "$GITHUB_WORKSPACE/tools"

      test -f go-linux.mod

      go build \
        -modfile=go-linux.mod \
        -o "$GITHUB_WORKSPACE/tools/create-fself" .

      chmod +x "$GITHUB_WORKSPACE/tools/create-fself"

      "$GITHUB_WORKSPACE/tools/create-fself" -h

  # 5. Vérifier les fichiers du projet
  - name: Verify project files
    run: |
      set -eu

      for file in \
        Makefile \
        src/main.cpp \
        tools/make_gp4.py \
        tools/create-fself \
        sce_sys/icon0.png
      do
        if [ ! -f "$file" ]; then
          echo "::error::Missing required file: $file"
          exit 1
        fi
      done

      echo "All required project files are present."

  # 6. Télécharger OpenOrbis
  - name: Pull OpenOrbis Docker image
    run: docker pull openorbisofficial/toolchain:latest

  # 7. Compiler l'application et générer le PKG
  - name: Compile with OpenOrbis
    run: |
      set -eu

      docker run --rm \
        --user 0:0 \
        -v "$GITHUB_WORKSPACE:/workspace" \
        -w /workspace \
        --entrypoint /bin/sh \
        openorbisofficial/toolchain:latest \
        -c '
          set -eu

          SDK="${OO_PS4_TOOLCHAIN:-/lib/OpenOrbisSDK}"

          echo "=== OpenOrbis SDK ==="
          echo "$SDK"

          mkdir -p "$SDK/bin/linux"

          # Synchroniser les fichiers SDK si le conteneur
          # les expose dans /usr/lib/OpenOrbisSDK.
          if [ -d /usr/lib/OpenOrbisSDK ]; then
            if [ "$(readlink -f "$SDK")" != \
                 "$(readlink -f /usr/lib/OpenOrbisSDK)" ]; then
              cp -an /usr/lib/OpenOrbisSDK/. "$SDK/"
            fi
          fi

          # Vérifier le convertisseur ELF
          if [ ! -x /workspace/tools/create-fself ]; then
            echo "ERROR: tools/create-fself is missing."
            exit 1
          fi

          # Vérifier le créateur de PKG
          if [ ! -x "$SDK/bin/linux/PkgTool.Core" ]; then
            echo "ERROR: PkgTool.Core is missing."
            echo "SDK directory contents:"
            ls -la "$SDK/bin/linux" || true
            exit 1
          fi

          # Vérifier les fichiers du linker
          if [ ! -f "$SDK/link.x" ]; then
            echo "ERROR: SDK link.x is missing."
            exit 1
          fi

          if [ ! -f "$SDK/lib/crt1.o" ]; then
            echo "ERROR: SDK lib/crt1.o is missing."
            exit 1
          fi

          echo "=== Toolchain ==="
