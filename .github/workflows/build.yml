name: Build M-PLAY PS4

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile and package M-PLAY PS4
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le dépôt
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Vérifier les fichiers du projet
      - name: Verify project files
        run: |
          echo "=== Repository ==="
          pwd
          ls -la

          missing=0

          for file in \
            Makefile \
            src/main.cpp \
            tools/make_gp4.py \
            sce_sys/icon0.png
          do
            if [ -f "$file" ]; then
              echo "OK: $file"
            else
              echo "MISSING: $file"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "Required files are missing."
            exit 1
          fi

      # 3. Diagnostiquer l'installation OpenOrbis
      - name: Diagnose OpenOrbis installation
        run: |
          docker pull openorbisofficial/toolchain:latest

          docker run --rm \
            --user 0:0 \
            --entrypoint /bin/sh \
            openorbisofficial/toolchain:latest \
            -c '
              echo "=== SDK environment ==="
              echo "OO_PS4_TOOLCHAIN=$OO_PS4_TOOLCHAIN"

              echo "=== SDK directory ==="
              ls -la /lib/OpenOrbisSDK || true

              echo "=== Linux tools ==="
              ls -la /lib/OpenOrbisSDK/bin/linux || true

              echo "=== Search create-fself ==="
              find / -type f -name create-fself 2>/dev/null || true

              echo "=== Search PkgTool.Core ==="
              find / -type f -name PkgTool.Core 2>/dev/null || true

              echo "=== Search linker ==="
              find / -type f -name ld.lld 2>/dev/null || true
            '

      # 4. Vérifier les outils attendus
      - name: Verify OpenOrbis tools
        run: |
          docker run --rm \
            --user 0:0 \
            --entrypoint /bin/sh \
            openorbisofficial/toolchain:latest \
            -c '
              test -x /lib/OpenOrbisSDK/bin/linux/create-fself &&
              test -x /lib/OpenOrbisSDK/bin/linux/PkgTool.Core &&
              test -f /lib/OpenOrbisSDK/link.x
            '

      # 5. Compiler et construire le package
      - name: Compile with OpenOrbis
        run: |
          docker run --rm \
            --user 0:0 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            openorbisofficial/toolchain:latest \
            make

      # 6. Publier les fichiers générés, même si le build échoue
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M-PLAY-PS4-build
          path: |
            *.pkg
            eboot.bin
            pkg.gp4
            build/**
            sce_sys/param.sfo
          if-no-files-found: warn
          retention-days: 7
