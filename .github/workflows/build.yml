name: Build M-PLAY PS4

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile and package M-PLAY PS4
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project files
        run: |
          echo "Current directory:"
          pwd

          echo "Repository contents:"
          ls -la

          echo "Checking required files..."
          missing=0

          for file in Makefile src/main.cpp tools/make_gp4.py sce_sys/icon0.png; do
            if [ -f "$file" ]; then
              echo "OK: $file"
            else
              echo "MISSING: $file"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "One or more required files are missing."
            exit 1
          fi

      - name: Compile with OpenOrbis
        run: |
          docker run --rm \
            --user 0:0 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            openorbisofficial/toolchain:latest \
            make

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M-PLAY-PS4-build
          path: |
            *.pkg
            eboot.bin
            pkg.gp4
            build/**
          if-no-files-found: warn
          retention-days: 7
