name: Build M-PLAY PS4

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check workflow and project
        run: |
          echo "Workflow started successfully"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"

          echo "Checking project files..."

          test -f Makefile
          test -f src/main.cpp
          test -f tools/make_gp4.py
          test -f sce_sys/icon0.png

          echo "Basic project checks passed."
